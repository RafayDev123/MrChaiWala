[package]
name = "mr-chai-wala"
version = "1.0.0"
description = "Mr Chai Wala - Cafe POS & Daily Hisaab (offline desktop app)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
